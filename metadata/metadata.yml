metadata_version: 1
name: End-to-End Control of a Powered Knee-Ankle Prosthesis Towards Unified, Tuning-Free Assistance
description: This package includes Python code to implement the temporal convolutional
  network (TCN) and the pre-trained torque and trajectory estimators used in "End-to-End
  Control of a Powered Knee-Ankle Prosthesis Towards Unified, Tuning-Free Assistance"
  by John Shim, Christoph P. O. Nuesslein, Sixu Zhou, Hanjun Kim, Kinsey Herrin, and
  Aaron J. Young.
